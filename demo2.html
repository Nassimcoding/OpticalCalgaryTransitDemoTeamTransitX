<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calgary Transit My Fare - Redesign Demo</title>
    <style>
        :root {
            --ct-red: #DA291C;
            --ct-dark-red: #A6192E;
            --bg-gray: #F4F6F8;
            --card-white: #FFFFFF;
            --text-main: #1C1C1E;
            --text-sub: #8E8E93;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background: #FFF;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: var(--ct-red);
            color: white;
            padding: 24px 20px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .active-ticket-card {
            background: linear-gradient(135deg, var(--ct-red), var(--ct-dark-red));
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(218, 41, 28, 0.25);
        }

        .ticket-status {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .ticket-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .action-button {
            width: 100%;
            padding: 16px;
            background: var(--card-white);
            border: 1px solid #E5E5EA;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .bottom-nav {
            height: 64px;
            border-top: 1px solid #E5E5EA;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #FFF;
        }

        .nav-item {
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }

        .nav-item.active {
            color: var(--ct-red);
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="header">
            <h1>Calgary Transit</h1>
        </div>

        <div class="content">
            <!-- Quick Access Active Ticket Card -->
            <div class="active-ticket-card">
                <span class="ticket-status">Active Pass</span>
                <h2 class="ticket-title">Adult Monthly Pass</h2>
                <p style="margin: 0; opacity: 0.9; font-size: 14px;">Expires in 12 days</p>
            </div>

            <!-- Quick Actions -->
            <button class="action-button">
                <span>🎟️ Buy Tickets / Passes</span>
                <span>→</span>
            </button>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active">Home</div>
            <div class="nav-item">Wallet</div>
            <div class="nav-item">Help</div>
            <div class="nav-item">Account</div>
        </div>
    </div>

</body>

</html>
